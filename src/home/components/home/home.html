<section class="hero">
  <div class="hero__content">
    <h1>Ristorino</h1>
    <p>Descubrí las mejores promociones gastronómicas cerca tuyo.</p>
  </div>
</section>

<section class="promos">
  <h2>Promociones destacadas</h2>

  <div *ngIf="loading" class="skeleton-grid" aria-busy="true" aria-live="polite">
    <div class="skeleton" *ngFor="let _ of [].constructor(6)"></div>
  </div>

  <p *ngIf="!loading && errorMsg" class="error">{{ errorMsg }}</p>

  <div class="grid" *ngIf="!loading">
    <ng-container *ngIf="(promotions$ | async) as promos">
      <rs-promotion-card
        *ngFor="let promo of promos; trackBy: trackByPromoId"
        [promo]="promo"
        (open)="openPromotion($event)">
      </rs-promotion-card>
      <p *ngIf="promos.length === 0 && !errorMsg" class="empty">No hay promociones por ahora.</p>
    </ng-container>
  </div>
</section>
