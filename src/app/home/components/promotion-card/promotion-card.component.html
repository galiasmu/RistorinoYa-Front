<article class="promo-card">
  <div class="promo-image-wrapper">
    <img
      [src]="promotion().imagenPromocional"
      [alt]="promotion().contenidoPromocional"
      class="promo-image"
    />
  </div>

  <div class="promo-body">
    <h3 class="promo-title">{{ promotion().nomSucursal }}</h3>
    <p class="promo-subtitle">Special offer</p>

    <button class="promo-button" type="button" (click)="onClick($event)">
      View Deal
    </button>
  </div>
</article>
