<article class="rounded-xl shadow p-4">
  <img [src]="promotion.imageUrl" [alt]="promotion.title" class="w-full h-40 object-cover rounded-md" />
  <h3 class="mt-3 text-lg font-semibold">{{ promotion.title }}</h3>
  <p class="text-sm text-gray-600">{{ promotion.description }}</p>
  <button class="mt-3 px-4 py-2 rounded bg-black text-white" (click)="open.emit()">
    Ver promoción
  </button>
</article>
