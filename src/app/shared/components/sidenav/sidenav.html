<header class="navbar">
  <div class="navbar-left">
    <div class="logo">
      <img src="/icon.png" alt="Ristorino Logo" class="logo-img" />
    </div>
    <span class="brand">Ristorino</span>
  </div>

  <nav class="navbar-center">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link" i18n>Descubrir</a>
    <a routerLink="/restaurantes" routerLinkActive="active" class="nav-link" i18n>Restaurantes</a>
    <a routerLink="/mis-reservas" routerLinkActive="active" class="nav-link" i18n>Mis reservas</a>
  </nav>

  <div class="navbar-right">
    @if (sesion) {
      <span class="nav-link">{{ sesion.nombre }}</span>
      <button class="btn-ghost" type="button" (click)="cerrarSesion()" i18n>Cerrar sesión</button>
    } @else {
      <a class="btn-ghost" routerLink="/login" i18n>Iniciar sesión</a>
    }
  </div>
</header>
